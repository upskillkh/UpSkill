name = "economic-intelligence-dashboard"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "economic-intelligence-db"
database_id = "cdaf1c1d-5365-4184-b013-6e09acd1330c"
migrations_dir = "migrations"

[triggers]
# One cron string covers three Cambodia-time slots, keeping this Worker at a
# single cron slot on the account (Workers Free allows 5 per account).
# Cambodia is UTC+7:
#   00:00 UTC -> 07:00 Cambodia  economic news briefing
#   11:00 UTC -> 18:00 Cambodia  economic news briefing
#   23:00 UTC -> 06:00 Cambodia (next day) daily skill development lesson
# The handler branches on scheduled.scheduledTime: 360 Cambodia-local minutes
# (06:00) sends the daily lesson, everything else sends the news briefing.
# The previous 07:30 reminder was removed; the 06:00 lesson supersedes it.
crons = ["0 0,11,23 * * *"]

[vars]
APP_NAME = "Economic Intelligence"
TIMEZONE = "Asia/Phnom_Penh"
MAX_STORIES = "100"
# Used in the Telegram learning reminder so the message links to this site.
SITE_URL = "https://economic-intelligence-dashboard.ebookskh855.workers.dev"

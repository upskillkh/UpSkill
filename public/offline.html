<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b2d">
<title>Offline | Up Skill PWA</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<style>
:root{--navy:#101b2d;--teal:#0f9f91;--muted:#6f7b8f}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:#fff;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.box{max-width:420px}
img{width:64px;height:64px;border-radius:16px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 10px}
p{color:#b8c4d6;margin:0 0 22px}
a.btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;border-radius:11px;
  padding:12px 22px;font-weight:700;margin:0 6px}
a.ghost{background:rgba(255,255,255,.12)}
.small{font-size:12px;color:#8d9cb4;margin-top:22px}
</style>
</head>
<body>
<div class="box">
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>Up Skill keeps the app available without a connection, but lessons you have not opened before need the internet.</p>
  <a class="btn" href="/welcome.html">Home</a>
  <a class="btn ghost" href="/skills.html">My learning</a>
  <p class="small">Your progress is saved on the server, not on this device. Nothing is lost.</p>
</div>
</body>
</html>
